<svg width="820" height="410" viewBox="0 0 820 410" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .t { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 15px; }
      .prompt { fill: #39d353; }
      .cmd { fill: #e6edf3; }
      .out { fill: #8b949e; }
      .cyan { fill: #56d4dd; }
      .dim { fill: #484f58; }
    </style>
    <clipPath id="c1"><rect x="195" y="56" height="22" width="0">
      <animate attributeName="width" values="0;0;70;70" keyTimes="0;0.02;0.06;1" dur="18s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="195" y="114" height="22" width="0">
      <animate attributeName="width" values="0;0;120;120" keyTimes="0;0.11;0.18;1" dur="18s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="195" y="238" height="22" width="0">
      <animate attributeName="width" values="0;0;100;100" keyTimes="0;0.26;0.31;1" dur="18s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c4"><rect x="195" y="296" height="22" width="0">
      <animate attributeName="width" values="0;0;90;90" keyTimes="0;0.38;0.42;1" dur="18s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <rect x="1" y="1" width="818" height="408" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="1" y="1" width="818" height="36" rx="10" fill="#161b22"/>
  <rect x="1" y="27" width="818" height="10" fill="#161b22"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="19" r="6" fill="#27c93f"/>
  <text x="410" y="24" text-anchor="middle" class="t dim">minimaxflora@github: ~/openwrt</text>

  <!-- L1 whoami -->
  <text x="24" y="72" class="t prompt">minimax@github:~$</text>
  <text x="195" y="72" class="t cmd" clip-path="url(#c1)">whoami</text>
  <text x="24" y="96" class="t out" opacity="0">MinimaxFlora // OpenWrt 自动化 · 固件构建 · 插件分发
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.07;0.09;1" dur="18s" repeatCount="indefinite"/>
  </text>

  <!-- L2 projects -->
  <text x="24" y="130" class="t prompt" opacity="0">minimax@github:~$
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.095;0.10;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <text x="195" y="130" class="t cmd" clip-path="url(#c2)">ls projects/</text>
  <text x="24" y="154" class="t" opacity="0"><tspan class="cyan">gh-action-imagebuilder/</tspan><tspan class="out" x="250">OpenWrt 固件构建 GitHub Action</tspan>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.19;0.20;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <text x="24" y="176" class="t" opacity="0"><tspan class="cyan">Extras_Paclages/</tspan><tspan class="out" x="250">插件包 · ipk/apk 按架构分发</tspan>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.20;0.21;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <text x="24" y="198" class="t" opacity="0"><tspan class="cyan">Firmware-Build/</tspan><tspan class="out" x="250">一键触发构建工作流</tspan>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.21;0.22;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <text x="24" y="220" class="t" opacity="0"><tspan class="cyan">action-gh-release/</tspan><tspan class="out" x="250">Release 发布 Action</tspan>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.22;0.23;1" dur="18s" repeatCount="indefinite"/>
  </text>

  <!-- L3 skills -->
  <text x="24" y="254" class="t prompt" opacity="0">minimax@github:~$
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.245;0.25;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <text x="195" y="254" class="t cmd" clip-path="url(#c3)">ls skills/</text>
  <text x="24" y="278" class="t out" opacity="0">bash  python  node.js  github-actions  openwrt  docker  git
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.32;0.34;1" dur="18s" repeatCount="indefinite"/>
  </text>

  <!-- L4 motto -->
  <text x="24" y="312" class="t prompt" opacity="0">minimax@github:~$
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.365;0.37;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <text x="195" y="312" class="t cmd" clip-path="url(#c4)">cat motto</text>
  <text x="24" y="336" class="t out" opacity="0">让 OpenWrt 更简单，让网络更自由
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.43;0.45;1" dur="18s" repeatCount="indefinite"/>
  </text>

  <!-- L5 idle prompt -->
  <g opacity="0">
    <text x="24" y="372" class="t prompt">minimax@github:~$</text>
    <rect x="195" y="359" width="9" height="17" fill="#e6edf3">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.50;1" dur="18s" repeatCount="indefinite"/>
  </g>
</svg>
